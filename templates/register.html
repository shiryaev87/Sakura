<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Sakura</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Sakura</a>
    </div>
  </nav>

  <main class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <section class="bg-white border rounded-3 shadow-sm p-4 p-md-5">
          <h1 class="h3 mb-4">Регистрация</h1>

          <form method="POST" action="/register">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                class="form-control"
                type="email"
                name="email"
                autocomplete="email"
                required
                autofocus
              >
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Пароль</label>
              <input
                id="password"
                class="form-control"
                type="password"
                name="password"
                autocomplete="new-password"
                required
              >
            </div>

            <button class="btn btn-dark w-100" type="submit">
              Зарегистрироваться
            </button>
          </form>

          <p class="mb-0 mt-4 text-center text-secondary">
            Уже есть аккаунт?
            <a href="/login">Войти</a>
          </p>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
