<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ if .Plot }}Редактирование участка{{ else }}Новый участок{{ end }}</title>
</head>
<body>
    <h1>{{ if .Plot }}Редактирование участка{{ else }}Новый участок{{ end }}</h1>

    {{ if .Plot }}
        <form method="POST" action="/admin/plots/{{ .Plot.ID }}/edit">
    {{ else }}
        <form method="POST" action="/admin/plots/new">
    {{ end }}

        <p>
            <label>Номер:
                <input type="text" name="number" value="{{ if .Plot }}{{ .Plot.Number }}{{ end }}" required>
            </label>
        </p>

        <p>
            <label>Площадь:
                <input type="number" step="0.01" name="area" value="{{ if .Plot }}{{ .Plot.Area }}{{ end }}" required>
            </label>
        </p>

        <p>
            <label>Цена:
                <input type="number" step="0.01" name="price" value="{{ if .Plot }}{{ .Plot.Price }}{{ end }}" required>
            </label>
        </p>

        <p>
            <label>Статус:
                <select name="status">
                    <option value="available" {{ if and .Plot (eq .Plot.Status "available") }}selected{{ end }}>Свободен</option>
                    <option value="reserved" {{ if and .Plot (eq .Plot.Status "reserved") }}selected{{ end }}>Забронирован</option>
                    <option value="sold" {{ if and .Plot (eq .Plot.Status "sold") }}selected{{ end }}>Продан</option>
                </select>
            </label>
        </p>

        <p>
            <label>SVG-точки:<br>
                <textarea name="svg_points" rows="6" cols="60">{{ if .Plot }}{{ .Plot.SvgPoints }}{{ end }}</textarea>
            </label>
        </p>

        <p>
            <button type="submit">Сохранить</button>
            <a href="/admin/plots">Отмена</a>
        </p>
    </form>
</body>
</html>
