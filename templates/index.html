<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura — участки</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* --- цвета участков на схеме --- */
    .status-available {
      fill: #4ade80;
    }

    .status-reserved {
      fill: #fbbf24;
    }

    .status-sold {
      fill: #f87171;
    }

    polygon {
      stroke: #333;
      stroke-width: 2;
      cursor: pointer;
      transition: filter 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }

    polygon:hover {
      filter: brightness(1.08);
      stroke: #111;
      stroke-width: 3;
    }

    text {
      font-family: sans-serif;
      font-size: 12px;
      pointer-events: none;
    }

    /* --- квадратики в легенде --- */
    .legend-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #333;
      border-radius: 3px;
      vertical-align: -2px;
    }

    .swatch-available {
      background: #4ade80;
    }

    .swatch-reserved {
      background: #fbbf24;
    }

    .swatch-sold {
      background: #f87171;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Sakura</span>
      <div class="d-flex align-items-center gap-3 text-white-50 small">
        {{if .LoggedIn}}
        <span>Пользователь №{{.UserID}}</span>
        <a class="link-light" href="/dashboard">Мои брони</a>
        <a class="link-light" href="/logout">Выйти</a>
        {{else}}
        <a class="link-light" href="/login">Войти</a>
        <a class="link-light" href="/register">Зарегистрироваться</a>
        {{end}}
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="h4 mb-3">Схема участков</h1>
    <div class="d-flex flex-wrap gap-3 small text-secondary mb-3">
      <span><i class="legend-swatch swatch-available"></i> свободен</span>
      <span><i class="legend-swatch swatch-reserved"></i> забронирован</span>
      <span><i class="legend-swatch swatch-sold"></i> продан</span>
    </div>


    <div class="bg-white border rounded-3 p-3 shadow-sm">
      <div id="scheme-wrap">
        {{template "scheme" .}}
      </div>
    </div>

</body>

</html>

{{define "scheme"}}
<svg id="scheme" viewBox="0 0 450 180" stule="width:100%; height:auto;display:block">
  {{range .Plots}}
  <g id="plot-{{.ID}}">
    <title> Участок №{{.Number}}:{{.Status}}. Площадь {{.Area}}. Цена {{.Price}} </title>
    <polygon points="{{.SvgPoints}}" class="status-{{.Status}}" {{if eq .Status "available" }}
      hx-post="/plots/{{.ID}}/reserve" hx-target="#scheme-wrap" hx-swap="innerHTML" {{end}} />
  </g>"
  {{end}}
</svg>
{{end}}
